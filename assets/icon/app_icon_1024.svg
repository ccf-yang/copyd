<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="96" y1="40" x2="936" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6670FF"/>
      <stop offset="0.52" stop-color="#6C5CF7"/>
      <stop offset="1" stop-color="#9B5CF6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.03"/>
