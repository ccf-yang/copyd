name: Build iOS IPA

# 仅手动触发：Actions 页面点 "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # 强制走 CocoaPods（下面的 Podfile / 部署目标处理基于 CocoaPods）
      - name: Use CocoaPods (disable SwiftPM)
        run: flutter config --no-enable-swift-package-manager || true

      # 仓库只提交 lib / test / pubspec，ios 目录由 CI 生成
      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.valo2 --project-name copyd .

      - name: Remove generated widget test
        run: rm -f test/widget_test.dart

      - name: Ensure iOS deployment target >= 13.0
        run: |
          python3 - <<'PY'
          import os, re, glob

          MIN = 13.0

          pod = 'ios/Podfile'
          if os.path.exists(pod):
              s = open(pod).read()
              m = re.search(r"^\s*platform :ios,\s*'([0-9.]+)'", s, re.M)
              if m and float(m.group(1)) < MIN:
                  s = re.sub(r"^\s*platform :ios,\s*'[0-9.]+'",
                             "platform :ios, '13.0'", s, flags=re.M)
                  open(pod, 'w').write(s)
          else:
              print('Podfile not found, rely on Xcode deployment target')

          def bump(m):
              cur = float(m.group(1))
              return 'IPHONEOS_DEPLOYMENT_TARGET = %.1f;' % max(cur, MIN)

          for p in glob.glob('ios/Runner.xcodeproj/project.pbxproj'):
              s = open(p).read()
              s = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = ([0-9.]+);', bump, s)
              open(p, 'w').write(s)
          PY
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" ios/Flutter/AppFrameworkInfo.plist || true
          echo '----- Podfile head -----'
          head -8 ios/Podfile || true

      - name: Patch Info.plist (显示名)
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CopyD" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string CopyD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST" || true

      - name: Flutter pub get
        run: flutter pub get


      # 静态分析：只有 error 才致命，编译前就能看到 Dart 错误与行号
      - name: Analyze Dart (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 只生成 Flutter/Xcode 配置，不触发 Flutter 的签名校验
      # 必须同时加 --no-codesign，否则 config-only 阶段仍会去校验证书
      - name: Prepare Flutter iOS config
        run: flutter build ios --release --config-only --no-codesign

      - name: CocoaPods install
        run: |
          cd ios
          pod install

      # 直接用 xcodebuild 编译，显式关闭签名，绕过 Development Team / 证书校验
      - name: Xcode build (unsigned)
        run: |
          set -e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/ios -type d -name Runner.app | head -1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr CopyD-unsigned.ipa Payload
          ls -lh CopyD-unsigned.ipa
          unzip -l CopyD-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: copyd-ipa
          path: CopyD-unsigned.ipa
          if-no-files-found: error

      - name: Read version from pubspec
        id: ver
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '\r')
          TAG="v$(echo "$V" | tr '+' '-')"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "V=$V  TAG=$TAG"

      # 发布到 GitHub Releases（同一 tag 会覆盖更新 IPA）
      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="CopyD ${{ steps.ver.outputs.version }}"
          FILE="CopyD-unsigned.ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            gh release create "$TAG" "$FILE" \
              --title "$TITLE" \
              --notes "自动构建的未签名 IPA（commit ${{ github.sha }} / run #${{ github.run_number }}）" \
              --latest
          fi
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/ios/**/*.log
            ios/Flutter/*.xcconfig
          if-no-files-found: ignore
